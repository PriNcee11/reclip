<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReClip — Free Media Downloader</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1eb;
      --fg: #3a3a38;
      --accent: #e85d2a;
      --accent-hover: #d04e1f;
      --muted: #9c9889;
      --card: #fff;
      --card-border: #e2ded6;
      --success: #2d8a4e;
      --error: #c43d3d;
      --warn: #a5610a;
      --radius: 14px;
      --shimmer: linear-gradient(90deg, #ebe8e2 25%, #f0ede7 50%, #ebe8e2 75%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      opacity: 0.03;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 128px;
    }

    .page {
      max-width: 620px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    .brand { margin-bottom: 48px; }
    .brand h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 4.2rem;
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--fg);
    }
    .brand h1 em { font-style: italic; color: var(--accent); }
    .brand p {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      padding: 18px 20px;
      border: 1.5px solid var(--card-border);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--fg);
      font-family: 'DM Mono', monospace;
      font-size: 0.88rem;
      outline: none;
      resize: none;
      min-height: 56px;
      transition: border-color 0.25s, box-shadow 0.25s;
      margin-bottom: 6px;
    }
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(232, 93, 42, 0.08);
    }
    textarea::placeholder { color: var(--muted); }

    .hint {
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 20px;
      letter-spacing: 0.02em;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 6px;
      align-items: center;
    }
    .pill-group {
      display: flex;
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--card);
    }
    .pill {
      padding: 9px 18px;
      font-family: 'DM Mono', monospace;
      font-size: 0.76rem;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .pill.active { background: var(--fg); color: var(--bg); }
    .pill:not(.active):hover { color: var(--fg); }

    .fetch-btn {
      flex: 1;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .fetch-btn:hover { background: var(--accent-hover); }
    .fetch-btn:active { transform: scale(0.98); }
    .fetch-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Cards */
    .cards { margin-top: 24px; }

    .card {
      display: flex;
      gap: 14px;
      border: 1.5px solid var(--card-border);
      border-radius: var(--radius);
      background: var(--card);
      padding: 14px;
      margin-bottom: 10px;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-thumb {
      width: 120px;
      min-width: 120px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--card-border);
      flex-shrink: 0;
      position: relative;
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* No-thumbnail icon */
    .card-thumb .no-thumb {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }
    .card-thumb .no-thumb svg {
      width: 28px;
      height: 28px;
      opacity: 0.5;
    }

    /* Shimmer skeleton for loading state */
    .card-thumb.loading {
      background: var(--shimmer);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    .skeleton-line {
      height: 12px;
      border-radius: 4px;
      background: var(--shimmer);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      margin-bottom: 6px;
    }
    .skeleton-line.short { width: 40%; height: 10px; }
    .skeleton-line.medium { width: 75%; }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .card-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .card-title {
      font-family: 'Instrument Serif', serif;
      font-size: 1rem;
      line-height: 1.3;
      color: var(--fg);
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-meta {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .card-dl-btn {
      padding: 6px 14px;
      border: none;
      border-radius: 7px;
      background: var(--fg);
      color: var(--bg);
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .card-dl-btn:hover { background: #2d2d2a; }
    .card-dl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .card-dl-btn.done { background: var(--success); color: #fff; }
    .card-dl-btn.error { background: var(--error); color: #fff; }

    .card-status {
      font-size: 0.68rem;
      color: var(--muted);
    }
    .card-status.downloading { color: var(--accent); }
    .card-status.done { color: var(--success); }
    .card-status.error { color: var(--error); }

    .q-chip {
      padding: 4px 10px;
      border: 1.5px solid var(--card-border);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .q-chip.active {
      border-color: var(--fg);
      color: var(--fg);
      background: rgba(26,26,24,0.04);
    }
    .q-chip:hover:not(.active) { border-color: var(--muted); }

    /* Error card */
    .card.card-error {
      border-color: rgba(196, 61, 61, 0.2);
      background: rgba(196, 61, 61, 0.03);
    }
    .card-error-icon {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(196, 61, 61, 0.08);
      color: var(--error);
    }
    .card-error-icon svg {
      width: 24px;
      height: 24px;
    }
    .card-error-msg {
      font-size: 0.72rem;
      color: var(--error);
      margin-top: 2px;
      line-height: 1.4;
    }
    .card-error-url {
      font-size: 0.65rem;
      color: var(--muted);
      word-break: break-all;
      margin-top: 4px;
    }

    /* Finished cards step back so the pending ones stand out */
    .card.is-done { opacity: 0.55; transition: opacity 0.2s; }
    .card.is-done:hover { opacity: 1; }

    /* Link downloaded before (any earlier session) */
    .card.seen { border-color: rgba(165, 97, 10, 0.35); }
    .card-seen {
      font-size: 0.68rem;
      color: var(--warn);
      line-height: 1.4;
      margin-bottom: 8px;
    }

    /* Past downloads (from the server's history), below this session's cards */
    .card.history { opacity: 0.75; transition: opacity 0.2s; }
    .card.history:hover { opacity: 1; }
    /* ...and stay compact while being downloaded again */
    .card.compact { padding: 10px 14px; }
    .card.compact .card-thumb { width: 84px; min-width: 84px; height: 54px; }
    .card.compact .card-meta { margin-bottom: 4px; }

    .more-btn {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 10px;
      border: 1.5px dashed var(--card-border);
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .more-btn:hover { color: var(--fg); border-color: var(--muted); }

    .card.flash { animation: flash 1.4s ease-out; }
    @keyframes flash {
      0%, 100% { box-shadow: 0 0 0 0 transparent; }
      25% { box-shadow: 0 0 0 3px var(--accent); }
    }

    /* Summary + bulk actions, pinned to the bottom of the screen (the sticky box
       must be the one sitting in .page, not the bar inside it) */
    #dl-all {
      position: sticky;
      bottom: 12px;
      z-index: 5;
    }
    .dl-all-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 10px;
      margin-top: 16px;
      padding: 10px;
      border: 1.5px solid var(--card-border);
      border-radius: var(--radius);
      background: rgba(244, 241, 235, 0.94);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 8px 28px rgba(58, 58, 56, 0.12);
    }
    .bar-summary {
      flex: 1 1 220px;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      line-height: 1.7;
      padding-left: 4px;
    }
    .bar-stat {
      border: none;
      background: none;
      padding: 0;
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      color: inherit;
      cursor: pointer;
      text-decoration: underline dotted;
      text-underline-offset: 3px;
    }
    .bar-stat:hover { color: var(--fg); }
    .bar-stat.todo { color: var(--fg); font-weight: 500; }
    .bar-stat.active { color: var(--accent); }
    .bar-stat.seen { color: var(--warn); }
    .bar-stat.failed { color: var(--error); }
    .bar-stat.clear { text-decoration: underline; }
    .bar-stat.all-done { color: var(--success); text-decoration: none; cursor: default; }
    .bar-sep { margin: 0 6px; opacity: 0.6; }
    .dl-all-btn {
      flex: 0 0 auto;
      padding: 11px 16px;
      border: none;
      border-radius: 10px;
      background: var(--fg);
      color: var(--bg);
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .dl-all-btn:hover { background: #2d2d2a; }
    .dl-all-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .spin {
      display: inline-block;
      width: 10px; height: 10px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.8;
    }

    /* Mobile */
    @media (max-width: 500px) {
      .brand h1 { font-size: 3rem; }
      .page { padding: 40px 16px 60px; }
      .card { flex-direction: column; gap: 10px; }
      .card-thumb {
        width: 100%;
        min-width: unset;
        height: 160px;
      }
      .card-title { white-space: normal; }
      /* History cards stay compact rows on the phone too */
      .card.compact { flex-direction: row; gap: 12px; }
      .card.compact .card-thumb { width: 72px; min-width: 72px; height: 48px; }
      .card.compact .card-title { white-space: nowrap; }
      .controls { flex-wrap: wrap; }
      .fetch-btn { width: 100%; }
      .dl-all-btn { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="brand">
      <h1>Re<em>Clip</em></h1>
      <p>Free media downloader</p>
    </div>

    <textarea id="urls" placeholder="Paste one or more URLs..." rows="2"></textarea>
    <p class="hint">Multiple links? Separate with spaces, commas, or newlines.</p>

    <div class="controls">
      <div class="pill-group">
        <button class="pill active" data-format="video" onclick="setFormat(this)">MP4</button>
        <button class="pill" data-format="audio" onclick="setFormat(this)">MP3</button>
      </div>
      <button class="fetch-btn" id="goBtn" onclick="go()">Fetch</button>
    </div>

    <div id="cards" class="cards"></div>
    <div id="more"></div>
    <div id="dl-all"></div>

    <div class="footer">
      YouTube &middot; TikTok &middot; Instagram &middot; Twitter/X &middot; Reddit &middot; Facebook<br>
      Vimeo &middot; Twitch &middot; Dailymotion &middot; SoundCloud &middot; Loom &middot; Streamable<br>
      Pinterest &middot; Tumblr &middot; Threads &middot; LinkedIn &middot; 1000+ more
    </div>
  </div>

  <script>
    let currentFormat = 'video';
    // Append-only: a card's index never changes, so running downloads keep their card
    // when more links are fetched.
    let cardData = [];
    // Download queue: "Download" queues the card; at most MAX_PARALLEL run at once.
    const MAX_PARALLEL = 2;
    let queueSeq = 0;

    function setFormat(btn) {
      document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFormat = btn.dataset.format;
    }

    function parseUrls(text) {
      return [...new Set(text.split(/[\s,]+/).map(u => u.trim()).filter(u => u.startsWith('http')))];
    }

    function isTweet(u) {
      return /^https?:\/\/(www\.|mobile\.)?(twitter|x|fxtwitter|vxtwitter|fixupx|fixvx)\.com\/[^/]+\/status\/\d+/i.test(u);
    }

    function fmtDur(s) {
      if (!s) return '';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    // "today at 18:05" / "on 12 Oct" / "on 12 Oct 2025"
    function fmtWhen(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return '';
      const now = new Date();
      if (d.toDateString() === now.toDateString()) {
        return 'today at ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
      }
      const opts = { day: 'numeric', month: 'short' };
      if (d.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
      return 'on ' + d.toLocaleDateString(undefined, opts);
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s ?? '';
      return d.innerHTML;
    }

    // For attribute values: esc() leaves quotes alone
    function escAttr(s) {
      return esc(s).replace(/"/g, '&quot;');
    }

    function friendlyError(err) {
      if (err.includes('Unsupported URL')) return 'This URL is not supported';
      if (err.includes('Video unavailable')) return 'Video is unavailable or private';
      if (err.includes('Private video')) return 'This video is private';
      if (err.includes('No video could be found')) return 'This post has no video';
      if (err.includes('HTTP Error 403')) return 'Access denied by the platform';
      if (err.includes('HTTP Error 404')) return 'Video not found';
      if (err.includes('copyright')) return 'Video blocked due to copyright';
      if (err.includes('geo')) return 'Video not available in your region';
      if (err.includes('timed out') || err.includes('Timed out')) return 'Request timed out — try again';
      if (err.includes('network') || err.includes('Network')) return 'Network error — check your connection';
      return err.length > 80 ? err.slice(0, 80) + '...' : err;
    }

    document.getElementById('urls').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); }
    });

    async function go() {
      const textarea = document.getElementById('urls');
      // Links that already have a card in this session (unless it failed or was
      // cleared) are not fetched again; their card blinks instead, so the paste
      // isn't silently dropped. History cards don't count: a new card on top says
      // "Already downloaded" and offers the qualities.
      const known = new Map();
      cardData.forEach((c, i) => {
        if (c.status !== 'info-error' && c.status !== 'history' && !c.cleared) known.set(c.url, i);
      });
      const parsed = parseUrls(textarea.value);
      const urls = parsed.filter(u => !known.has(u));
      parsed.filter(u => known.has(u)).forEach((u, n) => flashCard(known.get(u), n === 0 && !urls.length));
      textarea.value = '';
      if (!urls.length) return;

      const btn = document.getElementById('goBtn');
      btn.disabled = true;
      btn.textContent = 'Loading...';

      // Split X posts with several videos into one card per video
      for (let i = 0; i < urls.length; i++) {
        if (isTweet(urls[i]) && !/\/(video|photo)\/\d+/.test(urls[i])) {
          try {
            const res = await fetch('/api/expand', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ url: urls[i] }),
            });
            const data = await res.json();
            if (data.urls && data.urls.length > 1) {
              urls.splice(i, 1, ...data.urls);
              i += data.urls.length - 1;
            }
          } catch {}
        }
      }

      // Check if youtube playlist URL
      for (let i = 0; i < urls.length; i++) {
        if (urls[i].includes('list=')) {
          const res = await fetch('/api/playlist', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: urls[i] }),
          });
          const data = await res.json();
          if (data.urls) {
            // replace playlist URL with individual video URLs
            urls.splice(i, 1, ...data.urls);
          }
        }
      }

      // Newest on top: the whole batch goes above the older cards, in paste order
      const batch = [];
      for (const url of urls) {
        const idx = cardData.length;
        cardData.push({ url, status: 'loading', after: batch.length ? batch[batch.length - 1] : null });
        renderCard(idx);
        batch.push(idx);
      }

      for (const idx of batch) {
        const url = cardData[idx].url;
        try {
          const res = await fetch('/api/info', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url }),
          });
          const data = await res.json();
          if (data.error) {
            cardData[idx] = { ...cardData[idx], status: 'info-error', error: data.error };
          } else {
            cardData[idx] = {
              ...cardData[idx],
              status: 'ready',
              title: data.title || '',
              thumbnail: data.thumbnail || '',
              duration: data.duration,
              uploader: data.uploader || '',
              formats: data.formats || [],
              selectedFormatId: data.formats?.[0]?.id || null,
              downloaded: data.downloaded || null,
            };
          }
        } catch (err) {
          cardData[idx] = { ...cardData[idx], status: 'info-error', error: err.message };
        }
        renderCard(idx);
      }

      btn.disabled = false;
      btn.textContent = 'Fetch';
    }

    function renderCard(idx) {
      drawCard(idx);
      renderBar();
    }

    function drawCard(idx) {
      const c = cardData[idx];
      let el = document.getElementById(`card-${idx}`);
      if (c.cleared) {
        if (el) el.remove();
        return;
      }
      if (!el) {
        el = document.createElement('div');
        el.id = `card-${idx}`;
        el.className = 'card';
        // History arrives oldest-last at the bottom; new links go on top
        const list = document.getElementById('cards');
        const prev = c.after != null && document.getElementById(`card-${c.after}`);
        if (c.status === 'history') list.appendChild(el);
        else if (prev) prev.after(el);
        else list.prepend(el);
      }

      // Loading skeleton
      if (c.status === 'loading') {
        el.className = 'card';
        el.innerHTML = `
          <div class="card-thumb loading"></div>
          <div class="card-body">
            <div class="skeleton-line medium"></div>
            <div class="skeleton-line short"></div>
          </div>
        `;
        return;
      }

      // Error state
      if (c.status === 'info-error') {
        el.className = 'card card-error';
        el.innerHTML = `
          <div class="card-thumb">
            <div class="card-error-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            </div>
          </div>
          <div class="card-body">
            <div class="card-title" style="color:var(--error)">Could not fetch video</div>
            <div class="card-error-msg">${esc(friendlyError(c.error || ''))}</div>
            <div class="card-error-url">${esc(c.url)}</div>
          </div>
        `;
        return;
      }

      // Ready / downloading / done / error states
      const seen = c.status === 'ready' && c.downloaded;
      const past = c.status === 'history';
      el.className = 'card' + (seen ? ' seen' : '') + (c.status === 'done' ? ' is-done' : '') + (past ? ' history' : '') + (c.compact ? ' compact' : '');
      // Queued/finished cards keep the format they were queued with
      const isAudio = !past && (c.format || currentFormat) === 'audio';

      let thumbHtml;
      if (isAudio) {
        thumbHtml = `<div class="no-thumb" style="color:var(--accent)"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>`;
      } else if (c.thumbnail) {
        thumbHtml = `<img src="${escAttr(c.thumbnail)}" alt="" loading="lazy">`;
      } else {
        thumbHtml = `<div class="no-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>`;
      }

      let qualityChips = '';
      if (!isAudio && c.formats && c.formats.length > 1) {
        qualityChips = c.formats.map(f =>
          `<button class="q-chip${f.id === c.selectedFormatId ? ' active' : ''}" onclick="pickFormat(${idx}, '${f.id}')">${f.label}</button>`
        ).join('');
      }

      let actionHtml = '';
      if (past) {
        actionHtml = `<button class="card-dl-btn" onclick="dlCard(${idx})">Download again</button>
          <span class="card-status">Downloaded ${esc(fmtWhen(c.downloaded.at))} as ${c.downloaded.format === 'audio' ? 'MP3' : 'MP4'}</span>`;
      } else if (c.status === 'ready') {
        actionHtml = `<button class="card-dl-btn" onclick="dlCard(${idx})">${seen ? 'Download again' : 'Download'}</button>${qualityChips}`;
      } else if (c.status === 'queued') {
        actionHtml = `<button class="card-dl-btn" onclick="unqueueCard(${idx})">Remove</button>
          <span class="card-status">Queued #${queuePosition(idx)}</span>`;
      } else if (c.status === 'downloading') {
        actionHtml = `<span class="card-status downloading"><span class="spin"></span> Downloading...</span>`;
      } else if (c.status === 'done') {
        actionHtml = `<button class="card-dl-btn done" onclick="saveCard(${idx})">Save</button>
          <span class="card-status done">${esc(c.filename || '')}</span>`;
      } else if (c.status === 'error') {
        actionHtml = `<button class="card-dl-btn" onclick="dlCard(${idx})">Retry</button>
          <span class="card-status error">${esc(friendlyError(c.error || 'Download failed'))}</span>`;
      }

      el.innerHTML = `
        <div class="card-thumb">${thumbHtml}</div>
        <div class="card-body">
          <div class="card-title">${esc(c.title || 'Untitled')}</div>
          <div class="card-meta">${esc(c.uploader)}${c.duration ? ' · ' + fmtDur(c.duration) : ''}</div>
          ${seen ? `<div class="card-seen">Already downloaded ${esc(fmtWhen(c.downloaded.at))} as ${c.downloaded.format === 'audio' ? 'MP3' : 'MP4'}</div>` : ''}
          <div class="card-actions">${actionHtml}</div>
        </div>
      `;
    }

    // Which cards each counter of the bar stands for (also used to jump to them)
    const KINDS = {
      todo: c => c.status === 'ready' && !c.downloaded,
      seen: c => c.status === 'ready' && !!c.downloaded,
      active: c => c.status === 'queued' || c.status === 'downloading',
      done: c => c.status === 'done',
      failed: c => c.status === 'error' || c.status === 'info-error',
    };

    function countKind(kind) {
      return cardData.filter(c => !c.cleared && KINDS[kind](c)).length;
    }

    function renderBar() {
      const box = document.getElementById('dl-all');
      // Only this session's cards count; the history alone needs no bar
      if (!cardData.some(c => !c.cleared && c.status !== 'history')) { box.innerHTML = ''; return; }

      const n = Object.fromEntries(Object.keys(KINDS).map(k => [k, countKind(k)]));
      const loading = cardData.some(c => c.status === 'loading');
      const stat = (kind, text) => `<button class="bar-stat ${kind}" onclick="jumpTo('${kind}')">${text}</button>`;
      const parts = [];
      if (n.todo) parts.push(stat('todo', `${n.todo} to download`));
      if (n.seen) parts.push(stat('seen', `${n.seen} already downloaded`));
      if (n.active) parts.push(stat('active', `${n.active} in progress`));
      if (n.failed) parts.push(stat('failed', `${n.failed} failed`));
      if (n.done) parts.push(stat('done', `${n.done} done`));
      if (!n.todo && !n.seen && !n.active && !loading) {
        parts.unshift('<span class="bar-stat all-done">Nothing left to download</span>');
      }

      if (cardData.some(c => !c.cleared && (c.status === 'done' || c.status === 'info-error'))) {
        parts.push('<button class="bar-stat clear" onclick="clearFinished()">Clear finished</button>');
      }
      box.innerHTML = `<div class="dl-all-bar">
          <div class="bar-summary">${parts.join('<span class="bar-sep">·</span>')}</div>
          ${n.todo ? `<button class="dl-all-btn" onclick="dlAll()">Download all (${n.todo})</button>` : ''}
        </div>`;
    }

    function flashCard(idx, scroll) {
      const el = document.getElementById(`card-${idx}`);
      if (!el) return;
      if (scroll) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.remove('flash');
      void el.offsetWidth; // restart the animation
      el.classList.add('flash');
    }

    // Scroll to the first card of that kind
    function jumpTo(kind) {
      const idx = cardData.findIndex(c => !c.cleared && KINDS[kind](c));
      if (idx >= 0) flashCard(idx, true);
    }

    // Drop done and unfetchable cards from the list (the history still remembers them)
    function clearFinished() {
      cardData.forEach((c, i) => {
        if (c.status === 'done' || c.status === 'info-error') {
          c.cleared = true;
          drawCard(i);
        }
      });
      renderBar();
    }

    // --- history (past downloads, newest first) ---

    const HISTORY_PAGE = 50;
    let historyLoaded = 0;

    async function loadHistory() {
      const box = document.getElementById('more');
      try {
        const res = await fetch(`/api/history?limit=${HISTORY_PAGE}&offset=${historyLoaded}`);
        const data = await res.json();
        // A download finished meanwhile shifts the pages: skip links already shown
        const shown = new Set(cardData.filter(c => c.status === 'history').map(c => c.url));
        for (const e of data.entries || []) {
          if (shown.has(e.url)) continue;
          const idx = cardData.length;
          cardData.push({
            url: e.url,
            status: 'history',
            compact: true,
            title: e.title || '',
            thumbnail: e.thumbnail || '',
            uploader: e.uploader || '',
            duration: e.duration,
            downloaded: { at: e.at, format: e.format },
          });
          drawCard(idx);
        }
        historyLoaded += (data.entries || []).length;
        const left = (data.total || 0) - historyLoaded;
        box.innerHTML = left > 0
          ? `<button class="more-btn" onclick="loadHistory()">Show older (${left})</button>`
          : '';
      } catch {
        box.innerHTML = '';
      }
    }

    function pickFormat(idx, formatId) {
      cardData[idx].selectedFormatId = formatId;
      renderCard(idx);
    }

    // --- download queue ---

    function dlCard(idx) {
      const c = cardData[idx];
      c.status = 'queued';
      c.format = currentFormat;
      c.queuedAt = ++queueSeq;
      c.error = null;
      renderCard(idx);
      pumpQueue();
    }

    function unqueueCard(idx) {
      if (cardData[idx].status !== 'queued') return;
      cardData[idx].status = 'ready';
      renderCard(idx);
      renderQueued();
    }

    function queuedIndexes() {
      return cardData
        .map((c, i) => i)
        .filter(i => cardData[i].status === 'queued')
        .sort((a, b) => cardData[a].queuedAt - cardData[b].queuedAt);
    }

    function queuePosition(idx) {
      return queuedIndexes().indexOf(idx) + 1;
    }

    function renderQueued() {
      queuedIndexes().forEach(renderCard);
    }

    // Start queued downloads while there is a free slot; called whenever one ends.
    function pumpQueue() {
      let running = cardData.filter(c => c.status === 'downloading').length;
      for (const idx of queuedIndexes()) {
        if (running >= MAX_PARALLEL) break;
        running++;
        startDownload(idx);
      }
      renderQueued();
    }

    function finishCard(idx, status, fields) {
      Object.assign(cardData[idx], { status }, fields);
      renderCard(idx);
      pumpQueue();
    }

    async function startDownload(idx) {
      const c = cardData[idx];
      c.status = 'downloading';
      renderCard(idx);

      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: c.url,
            format: c.format,
            format_id: c.selectedFormatId,
            title: c.title || '',
            thumbnail: c.thumbnail || '',
            uploader: c.uploader || '',
            duration: c.duration,
          }),
        });
        const data = await res.json();
        if (data.error) {
          finishCard(idx, 'error', { error: data.error });
          return;
        }
        c.jobId = data.job_id;
        pollCard(idx);
      } catch (err) {
        finishCard(idx, 'error', { error: err.message });
      }
    }

    function pollCard(idx) {
      const c = cardData[idx];
      const iv = setInterval(async () => {
        try {
          const res = await fetch(`/api/status/${c.jobId}`);
          const data = await res.json();
          if (data.status === 'done') {
            clearInterval(iv);
            finishCard(idx, 'done', { filename: data.filename });
            saveCard(idx);
          } else if (data.status === 'error') {
            clearInterval(iv);
            finishCard(idx, 'error', { error: data.error });
          }
        } catch {
          clearInterval(iv);
          finishCard(idx, 'error', { error: 'Lost connection to server' });
        }
      }, 1000);
    }

    function saveCard(idx) {
      const c = cardData[idx];
      if (!c.jobId) return;
      const a = document.createElement('a');
      a.href = `/api/file/${c.jobId}`;
      a.download = c.filename || '';
      a.click();
    }

    // Links downloaded before are left out: those need their own "Download again"
    function dlAll() {
      cardData.forEach((c, i) => { if (KINDS.todo(c)) dlCard(i); });
    }

    loadHistory();
  </script>
</body>
</html>
